specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Rippling
providerId: rippling
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - HR
  - HCM
  - IT
  - Payroll
  - Spend Management
  - Plans
description: >-
  Rippling sells composable HR, IT, and Finance products on a per-employee-
  per-month basis with custom-quoted pricing — no public price list. Plans
  below capture the major product lines as quote-based per-seat entries.
  Public pricing is intentionally not displayed by Rippling; engage their
  sales team for current rates.
sources:
  - https://www.rippling.com/pricing
notes: >-
  Rippling does not publish list prices. Each product is custom-quoted on a
  per-employee-per-month basis with optional base fees. Replace price values
  with your negotiated rates after quote.
plans:
  - id: rippling-platform
    name: Rippling Platform (Required Core)
    type: per-seat
    description: >-
      Required platform layer providing employee directory, SSO, workflows,
      and reporting underneath every Rippling product.
    entries:
      - label: Per Employee / Month
        name: platform_seat
        type: flat
        metric: employees
        timeFrame: monthly
        unit: 1
        price: contact-sales
        currency: USD
        userMultiplied: true
  - id: rippling-hr-cloud
    name: HR Cloud
    type: per-seat
    description: HRIS, onboarding, time off, time tracking, performance, learning.
    entries:
      - label: Per Employee / Month
        name: hr_cloud_seat
        type: flat
        metric: employees
        timeFrame: monthly
        unit: 1
        price: contact-sales
        currency: USD
        userMultiplied: true
  - id: rippling-payroll
