specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Rippling
providerId: rippling
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - HR
  - HCM
  - IT
  - Payroll
  - Rate Limiting
  - Throttling
description: >-
  Rippling enforces per-token rate limits across the Platform API. Limits are
  documented per partner tenant and are typically applied as a sliding window
  on requests-per-minute. When exceeded, Rippling returns HTTP 429 and clients
  must back off and honor any Retry-After header.
sources:
  - https://developer.rippling.com/
notes: >-
  Specific request-per-minute thresholds vary by API surface and partnership
  tier. Inspect X-RateLimit-* response headers from the API for authoritative
  per-token limits.
responseCodes:
  throttled: 429
limits:
  - name: Per Token Default
    scope: token
    metric: requests
    notes: >-
      Default sliding-window limit applied per access token. 429 returned
      with Retry-After header when exceeded.
  - name: Listing / Search Endpoints
    scope: token
    metric: requests
    notes: >-
      Higher cost per request; use pagination cursors and avoid wide list
      polling.
  - name: SCIM Provisioning
    scope: connection
    metric: requests
    notes: >-
      SCIM provisioning is rate-limited per IdP connection; large bulk
      operations should be batched.
  - name: Webhook Delivery
    scope: subscription
    metric: events
    notes: >-
      Webhooks are delivered with retry-on-5xx; receivers must respond
      within the platform timeout to avoid retry storms.
policies:
  - name: Backoff Strategy
    description: >-
      Exponential backoff with jitter on 429 responses; honor Retry-After
      and avoid retrying without elapsed wait.
  - name: Pagination
    description: >-
      Always paginate list endpoints rather than scanning entire collections
      to remain inside per-endpoint limits.
  - name: Webhook-Plus-Polling
    description: >-
      Prefer webhooks for change notification and reduce poll frequency on
      list endpoints.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
