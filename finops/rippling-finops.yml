specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Rippling
providerId: rippling
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - HR
  - HCM
  - IT
  - Payroll
  - Spend Management
  - FinOps
  - FOCUS
description: >-
  Rippling's billing model is per-employee-per-month subscription pricing
  across composable HR, IT, and Finance products with custom-quoted enterprise
  contracts. This artifact maps Rippling charges to FOCUS columns for FinOps
  allocation across cost centers and product lines.
sources:
  - https://www.rippling.com/pricing
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Rippling
serviceCategory: HR
billingModel:
  pricingCategory: Subscription Per Seat
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
    - Tax
focusColumns:
  ServiceName: Rippling
  ServiceCategory: HR
  ProviderName: Rippling
  PublisherName: Rippling
  InvoiceIssuerName: Rippling
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: platform_seats
    description: Required Rippling Platform seats; foundation for every product.
    unit: employee-month
    aggregation: sum
    dimensions:
      - department
      - cost_center
  - name: hr_cloud_seats
    description: HR Cloud (HRIS, time off, performance, learning) per-employee fees.
    unit: employee-month
    aggregation: sum
    dimensions:
      - department
      - cost_center
  - name: payroll_seats
    description: US payroll per-employee fees plus tax-filing services.
    unit: employee-month
    aggregation: sum
    dimensions:
      - state
      - cost_center
  - name: global_payroll_seats
    description: Native global payroll per-employee fees.
    unit: employee-month
    aggregation: sum
    dimensions:
      - country
      - cost_center
  - name: eor_seats
    description: Employer-of-record seats with country-specific cost loadings.
    unit: employee-month
    aggregation: sum
    dimensions:
      - country
      - cost_center
  - name: it_seats
    description: IT Cloud seats covering devices, MDM, apps, and identity.
    unit: employee-month
    aggregation: sum
    dimensions:
      - department
      - cost_center
  - name: spend_seats
    description: Spend product seats (cards, expenses, bill pay).
    unit: employee-month
    aggregation: sum
    dimensions:
      - department
      - cost_center
  - name: recruiting_seats
    description: Recruiting seats per active hiring user or per-employee model.
    unit: employee-month
    aggregation: sum
    dimensions:
      - department
      - cost_center
  - name: pass_through_costs
    description: Statutory benefits, payroll taxes, EOR loadings, hardware purchases.
    unit: events
    aggregation: sum
    dimensions:
      - service
      - country
principles:
  - name: Visibility
    description: >-
      Pull Rippling monthly invoices and product-line statements; match
      seat counts to active employees in HRIS.
  - name: Allocation
    description: >-
      Allocate seats by department, cost center, and country using HRIS
      attributes pushed via Platform API or webhooks.
  - name: Optimization
    description: >-
      Audit monthly which Rippling products each employee uses; remove
      seats for unused products and renegotiate bundles at renewal.
  - name: Accountability
    description: >-
      Designate per-product owners (HRBP, IT lead, Finance lead) and
      review against negotiated MSA at renewal.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
